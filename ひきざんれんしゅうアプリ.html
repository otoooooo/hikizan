<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>くり下がりの ひきざん（さくらんぼけいさん）</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for friendly rounded text -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* Cherry branch visual styling */
        .cherry-line {
            stroke: #3b82f6;
            stroke-width: 4;
            stroke-dasharray: 6 6;
            animation: dash 1s linear infinite;
        }
        @keyframes dash {
            to { stroke-dashoffset: -12; }
        }

        /* Animated connection oval for subtracting from 10 */
        .subtract-10-circle {
            stroke: #e11d48;
            stroke-width: 6;
            stroke-dasharray: 8 6;
            fill: rgba(225, 29, 72, 0.15);
            animation: pulse-ellipse 1.5s infinite ease-in-out;
        }
        @keyframes pulse-ellipse {
            0%, 100% { stroke-width: 6; fill: rgba(225, 29, 72, 0.15); }
            50% { stroke-width: 9; fill: rgba(225, 29, 72, 0.25); }
        }

        /* Active input animation & pulse ring */
        .active-input-ring {
            box-shadow: 0 0 0 6px #f59e0b, 0 0 24px rgba(245, 158, 11, 0.8);
            border-color: #f59e0b !important;
            background-color: #fef08a !important;
            transform: scale(1.15);
            animation: active-pulse 1.2s infinite ease-in-out;
            z-index: 30;
        }
        @keyframes active-pulse {
            0%, 100% { transform: scale(1.15); box-shadow: 0 0 0 6px #f59e0b, 0 0 24px rgba(245, 158, 11, 0.8); }
            50% { transform: scale(1.22); box-shadow: 0 0 0 10px #fbbf24, 0 0 32px rgba(251, 191, 36, 1); }
        }
    </style>
</head>
<body class="bg-sky-50 min-h-screen text-slate-800 flex flex-col justify-between overflow-x-hidden">

    <!-- Header Section -->
    <header class="bg-sky-300 border-b-4 border-sky-400 p-3 sm:p-4 shadow-sm">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-3xl">🍒</span>
                <h1 class="text-xl sm:text-2xl font-black text-blue-700 tracking-wide">
                    さくらんぼ ひきざん
                </h1>
            </div>
            <!-- Progress / Stars -->
            <div class="flex items-center space-x-2">
                <!-- Stamp Count Badge -->
                <button onclick="openStampCard()" class="flex items-center bg-blue-100 hover:bg-blue-200 active:scale-95 px-2.5 py-1 rounded-full border-2 border-blue-400 shadow-sm transition-all cursor-pointer">
                    <span class="text-xl mr-1">💮</span>
                    <span id="stamp-badge-count" class="text-base font-black text-blue-700">0/10</span>
                </button>

                <div class="flex items-center bg-white px-3 py-1.5 rounded-full border-2 border-sky-400 shadow-inner">
                    <span class="text-amber-500 text-xl mr-1.5">⭐</span>
                    <span id="score-text" class="text-lg font-black text-sky-700">0 / 5 問</span>
                </div>
            </div>
        </div>

        <!-- Level Selector Tabs -->
        <div class="max-w-xl mx-auto px-4 mt-3 flex justify-center gap-2 text-sm sm:text-base">
            <button id="level-btn-egg" onclick="changeLevel('egg')" class="level-btn flex-1 py-1.5 px-2 rounded-2xl font-black transition-all border-b-4 bg-sky-500 text-white border-sky-700 shadow-md">
                🥚 たまご
            </button>
            <button id="level-btn-chick" onclick="changeLevel('chick')" class="level-btn flex-1 py-1.5 px-2 rounded-2xl font-black transition-all border-b-4 bg-white text-slate-600 border-slate-300 hover:bg-sky-100">
                🐥 ひよこ
            </button>
            <button id="level-btn-chicken" onclick="changeLevel('chicken')" class="level-btn flex-1 py-1.5 px-2 rounded-2xl font-black transition-all border-b-4 bg-white text-slate-600 border-slate-300 hover:bg-sky-100">
                🐓 にわとり
            </button>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="max-w-xl w-full mx-auto p-4 flex-grow flex flex-col justify-center">
        
        <!-- Question Card -->
        <div id="game-card" class="bg-white rounded-3xl p-4 sm:p-6 border-4 border-sky-200 shadow-xl relative min-h-[460px] flex flex-col justify-between">
            
            <!-- Step Guide Banner -->
            <div id="step-banner" class="bg-blue-100 border-2 border-blue-300 text-blue-800 font-bold px-4 py-2 rounded-2xl text-center text-base sm:text-lg mb-2 shadow-sm transition-all duration-300">
                <!-- Dynamic text inserted by JS -->
            </div>

            <!-- Mathematical Cherry Math Canvas Area -->
            <div id="canvas-container" class="relative w-full h-64 sm:h-72 my-2 flex justify-center items-center select-none">
                <!-- Dynamic SVG overlays for connections and oval -->
                <svg id="svg-overlay" class="absolute inset-0 w-full h-full pointer-events-none z-10" style="overflow: visible;">
                    <!-- Lines & Circles drawn via JS -->
                </svg>

                <!-- Calculation Numbers Container -->
                <div class="w-full max-w-md h-full relative flex flex-col justify-between px-2 sm:px-6 py-2">
                    
                    <!-- Top Row: Formula A - B = Ans -->
                    <div class="flex justify-around items-center text-4xl sm:text-5xl font-black text-slate-700 z-20 mt-2">
                        <!-- Number A (e.g., 13) -->
                        <div id="num-a" class="w-16 h-16 sm:w-20 sm:h-20 bg-blue-100 rounded-2xl flex items-center justify-center border-4 border-blue-400 shadow-md">
                            13
                        </div>
                        <div class="text-blue-500 font-bold">-</div>
                        <!-- Number B (e.g., 5) -->
                        <div id="num-b" class="w-16 h-16 sm:w-20 sm:h-20 bg-rose-100 rounded-2xl flex items-center justify-center border-4 border-rose-300 shadow-md">
                            5
                        </div>
                        <div class="text-slate-400 font-bold">=</div>
                        <!-- Final Answer Slot -->
                        <div id="ans-box" onclick="selectInput('ans')" class="w-20 h-16 sm:w-24 sm:h-20 bg-emerald-50 rounded-2xl border-4 border-emerald-400 flex items-center justify-center text-emerald-600 font-black text-4xl sm:text-5xl shadow-md transition-all cursor-pointer">
                            ?
                        </div>
                    </div>

                    <!-- Middle Row: Cherry Splits (Split A into 10 and remainder) -->
                    <div class="flex justify-between items-center px-4 sm:px-8 z-20">
                        <!-- Cherry Branch Split Nodes under A -->
                        <div class="flex space-x-6 sm:space-x-10 ml-1 sm:ml-2">
                            <!-- Cherry Part 1 (10) -->
                            <div class="relative flex flex-col items-center">
                                <button id="cherry-1-btn" onclick="selectInput('cherry1')" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-blue-50 border-4 border-blue-400 flex items-center justify-center text-3xl sm:text-4xl font-black text-blue-600 shadow-lg hover:bg-blue-100 transition-all duration-200">
                                    ?
                                </button>
                            </div>

                            <!-- Cherry Part 2 (Remainder of A) -->
                            <div class="relative flex flex-col items-center">
                                <button id="cherry-2-btn" onclick="selectInput('cherry2')" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-blue-50 border-4 border-blue-400 flex items-center justify-center text-3xl sm:text-4xl font-black text-blue-600 shadow-lg hover:bg-blue-100 transition-all duration-200">
                                    ?
                                </button>
                            </div>
                        </div>

                        <!-- 10 Minus Display & Input Indicator (Right) - Enlarged for clarity -->
                        <div id="ten-badge" class="opacity-0 transition-all duration-500 bg-rose-500 text-white font-black px-3 py-2 sm:px-4 sm:py-3 rounded-3xl text-base sm:text-xl shadow-xl border-4 border-white flex items-center gap-2 sm:gap-3 z-20 whitespace-nowrap">
                            <span id="ten-sub-text" class="drop-shadow-sm leading-none">10 - 5 =</span>
                            <button id="ten-sub-btn" onclick="selectInput('tenSub')" class="w-12 h-12 sm:w-14 sm:h-14 bg-white text-rose-600 rounded-2xl border-4 border-rose-300 flex items-center justify-center text-xl sm:text-2xl font-black shadow-inner cursor-pointer hover:bg-rose-50 transition-all flex-shrink-0">
                                ?
                            </button>
                        </div>
                    </div>

                    <!-- Bottom Step Helper Text -->
                    <div id="bottom-helper" class="text-center h-8 font-bold text-slate-500 text-sm sm:text-base">
                        <!-- Helper hint messages -->
                    </div>
                </div>
            </div>

            <!-- Number Keypad / Input Options -->
            <div class="mt-2">
                <div class="grid grid-cols-5 gap-2 max-w-md mx-auto">
                    <button onclick="pressKey(1)" class="key-btn bg-slate-100 hover:bg-sky-200 active:scale-95 border-b-4 border-slate-300 text-2xl font-black py-3 rounded-2xl text-slate-700 transition-all">1</button>
                    <button onclick="pressKey(2)" class="key-btn bg-slate-100 hover:bg-sky-200 active:scale-95 border-b-4 border-slate-300 text-2xl font-black py-3 rounded-2xl text-slate-700 transition-all">2</button>
                    <button onclick="pressKey(3)" class="key-btn bg-slate-100 hover:bg-sky-200 active:scale-95 border-b-4 border-slate-300 text-2xl font-black py-3 rounded-2xl text-slate-700 transition-all">3</button>
                    <button onclick="pressKey(4)" class="key-btn bg-slate-100 hover:bg-sky-200 active:scale-95 border-b-4 border-slate-300 text-2xl font-black py-3 rounded-2xl text-slate-700 transition-all">4</button>
                    <button onclick="pressKey(5)" class="key-btn bg-slate-100 hover:bg-sky-200 active:scale-95 border-b-4 border-slate-300 text-2xl font-black py-3 rounded-2xl text-slate-700 transition-all">5</button>

                    <button onclick="pressKey(6)" class="key-btn bg-slate-100 hover:bg-sky-200 active:scale-95 border-b-4 border-slate-300 text-2xl font-black py-3 rounded-2xl text-slate-700 transition-all">6</button>
                    <button onclick="pressKey(7)" class="key-btn bg-slate-100 hover:bg-sky-200 active:scale-95 border-b-4 border-slate-300 text-2xl font-black py-3 rounded-2xl text-slate-700 transition-all">7</button>
                    <button onclick="pressKey(8)" class="key-btn bg-slate-100 hover:bg-sky-200 active:scale-95 border-b-4 border-slate-300 text-2xl font-black py-3 rounded-2xl text-slate-700 transition-all">8</button>
                    <button onclick="pressKey(9)" class="key-btn bg-slate-100 hover:bg-sky-200 active:scale-95 border-b-4 border-slate-300 text-2xl font-black py-3 rounded-2xl text-slate-700 transition-all">9</button>
                    <button onclick="pressKey(0)" class="key-btn bg-slate-100 hover:bg-sky-200 active:scale-95 border-b-4 border-slate-300 text-2xl font-black py-3 rounded-2xl text-slate-700 transition-all">0</button>
                </div>

                <!-- Action Controls: Delete & Confirm -->
                <div class="flex justify-center gap-3 mt-3 max-w-md mx-auto">
                    <button onclick="pressDelete()" class="w-1/3 bg-slate-200 hover:bg-slate-300 active:scale-95 border-b-4 border-slate-400 font-bold py-2.5 rounded-2xl text-slate-600 transition-all text-sm sm:text-base flex items-center justify-center gap-1">
                        <span>⌫ けす</span>
                    </button>
                    <button id="check-btn" onclick="checkAnswer()" class="w-2/3 bg-sky-600 hover:bg-sky-700 active:scale-95 border-b-4 border-sky-800 text-white font-black py-2.5 rounded-2xl text-lg sm:text-xl shadow-md transition-all">
                        こたえあわせ 🍒
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer Feedback & Hint Banner -->
    <footer class="p-3 text-center text-slate-400 text-xs sm:text-sm">
        しょうがっこう 1ねんせい まなび サポート | さくらんぼひきざん
    </footer>

    <!-- Result / Reward Modal Screen -->
    <div id="result-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white border-4 border-sky-300 rounded-3xl p-6 sm:p-8 max-w-md w-full text-center shadow-2xl transform transition-all scale-90">
            <div class="text-6xl mb-3">🎉 🌸 ✨</div>
            <h2 class="text-2xl sm:text-3xl font-black text-sky-600 mb-2">たいへん よくできました！</h2>
            <p class="text-slate-600 font-bold mb-4 text-base sm:text-lg">
                5もん クリアしたよ！<br>
                スタンプを 1こ ゲット！ 💮
            </p>
            
            <div class="my-4 bg-sky-50 border-2 border-sky-200 rounded-2xl p-3 flex justify-center items-center gap-2">
                <span class="text-sm font-bold text-sky-700">スタンプカード:</span>
                <span id="modal-stamp-count" class="text-xl font-black text-sky-600">0 / 10 個</span>
            </div>

            <button onclick="confirmResultModal()" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 border-b-4 border-emerald-700 text-white font-black py-3.5 rounded-2xl text-xl shadow-lg transition-all">
                つぎの もんだいへ 🚀
            </button>
        </div>
    </div>

    <!-- Stamp Card Modal -->
    <div id="stamp-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-sky-50 border-4 border-sky-400 rounded-3xl p-5 sm:p-7 max-w-md w-full text-center shadow-2xl relative">
            <button onclick="closeStampCard()" class="absolute top-3 right-3 w-9 h-9 bg-slate-200 hover:bg-slate-300 rounded-full font-black text-slate-600 flex items-center justify-center text-lg">
                ✕
            </button>

            <h2 class="text-2xl font-black text-sky-800 mb-1 flex items-center justify-center gap-2">
                <span>💮</span> さくらんぼ スタンプカード
            </h2>
            <p class="text-xs sm:text-sm font-bold text-sky-800 mb-4">5もん クリアごとに スタンプが おせるよ！</p>

            <div id="stamp-grid" class="grid grid-cols-5 gap-3 bg-white p-4 rounded-2xl border-2 border-sky-200 shadow-inner mb-5">
                <!-- 10 Stamp Slots Generated via JS -->
            </div>

            <button onclick="closeStampCard()" class="w-full bg-sky-500 hover:bg-sky-600 border-b-4 border-sky-700 text-white font-black py-2.5 rounded-2xl text-lg shadow-md transition-all">
                とじる
            </button>
        </div>
    </div>

    <!-- Special 10-Stamp Celebration Modal -->
    <div id="special-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-gradient-to-b from-yellow-100 via-sky-100 to-amber-100 border-8 border-yellow-400 rounded-3xl p-6 sm:p-8 max-w-lg w-full text-center shadow-2xl">
            <div class="text-7xl mb-2 animate-pulse">👑 🏆 👑</div>
            <h2 class="text-3xl sm:text-4xl font-black text-blue-600 mb-2 drop-shadow-md">
                すごすぎる！！<br>かんぜん クリア！
            </h2>
            <p class="text-slate-700 font-extrabold text-lg sm:text-xl mb-4">
                スタンプが 10こ ぜんぶ あつまったよ！<br>
                きみは ほんとうの <span class="text-blue-600 text-2xl font-black underline">ひきざんマスター</span> だ！ 🍒✨
            </p>
            <div class="text-5xl mb-6 flex justify-center gap-2">
                <span>💮</span><span>💮</span><span>💮</span><span>💮</span><span>💮</span>
            </div>
            <button onclick="resetStampsAndContinue()" class="w-full bg-gradient-to-r from-blue-500 to-sky-500 hover:from-blue-600 hover:to-sky-600 border-b-4 border-blue-700 text-white font-black py-4 rounded-2xl text-2xl shadow-xl transition-all">
                あたらしカードで チャレンジ 🌟
            </button>
        </div>
    </div>

    <!-- Muted SFX Placeholder -->
    <script>
        const sfx = {
            init: () => {},
            playTone: () => {},
            tap: () => {},
            correct: () => {},
            stepComplete: () => {},
            wrong: () => {},
            fanfare: () => {},
            stamp: () => {},
            superFanfare: () => {}
        };
    </script>

    <!-- Main Subtraction Game Logic -->
    <script>
        // Game State
        let numA = 13;
        let numB = 5;
        let cherry1Val = 10; // Left cherry node under A is always 10
        let cherry2Val = 3;  // Right cherry node under A is A - 10
        let tenMinusB = 5;   // 10 - B
        let finalAns = 8;    // tenMinusB + cherry2Val
        
        let currentStep = 1;
        let currentLevel = 'egg';
        
        let activeInputTarget = 'cherry1';
        let inputValues = {
            cherry1: '',
            cherry2: '',
            tenSub: '',
            ans: ''
        };

        let currentQuestionIndex = 0;
        const totalQuestions = 5;
        let questions = [];

        // Stamp State (Load from localStorage if available)
        let stampCount = parseInt(localStorage.getItem('sakuranbo_sub_stamp_count') || '0', 10);

        // Stamp Card Operations
        function updateStampUI() {
            document.getElementById('stamp-badge-count').textContent = `${stampCount}/10`;
            document.getElementById('modal-stamp-count').textContent = `${stampCount} / 10 個`;
            renderStampGrid();
        }

        function renderStampGrid() {
            const grid = document.getElementById('stamp-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const slot = document.createElement('div');
                slot.className = "w-12 h-12 sm:w-14 sm:h-14 rounded-full border-2 border-dashed border-sky-300 flex items-center justify-center text-xl sm:text-2xl font-black relative bg-sky-50/50";
                
                if (i <= stampCount) {
                    slot.innerHTML = `<span class="transform scale-110 drop-shadow">💮</span>`;
                    slot.className = "w-12 h-12 sm:w-14 sm:h-14 rounded-full border-2 border-blue-400 bg-blue-100 flex items-center justify-center text-2xl sm:text-3xl font-black animate-pulse";
                } else {
                    slot.innerHTML = `<span class="text-sky-300 text-xs">${i}</span>`;
                }
                grid.appendChild(slot);
            }
        }

        function openStampCard() {
            sfx.tap();
            updateStampUI();
            document.getElementById('stamp-modal').classList.remove('hidden');
        }

        function closeStampCard() {
            sfx.tap();
            document.getElementById('stamp-modal').classList.add('hidden');
        }

        // Change Difficulty Level
        function changeLevel(level) {
            currentLevel = level;
            sfx.tap();

            const levels = ['egg', 'chick', 'chicken'];
            levels.forEach(l => {
                const btn = document.getElementById(`level-btn-${l}`);
                if (l === level) {
                    btn.className = "level-btn flex-1 py-1.5 px-2 rounded-2xl font-black transition-all border-b-4 bg-sky-500 text-white border-sky-700 shadow-md scale-105";
                } else {
                    btn.className = "level-btn flex-1 py-1.5 px-2 rounded-2xl font-black transition-all border-b-4 bg-white text-slate-600 border-slate-300 hover:bg-sky-100";
                }
            });

            updateUIState();
        }

        // Questions Generator for Regrouping Subtraction (A - B)
        function generateQuestions() {
            const pool = [];
            for (let a = 11; a <= 18; a++) {
                const ones = a % 10;
                for (let b = ones + 1; b <= 9; b++) {
                    const ans = a - b;
                    if (ans >= 1 && ans <= 9) {
                        pool.push({ a, b });
                    }
                }
            }
            pool.sort(() => Math.random() - 0.5);
            return pool.slice(0, totalQuestions);
        }

        // Load Question
        function loadQuestion(index) {
            currentStep = 1;
            const q = questions[index];
            numA = q.a;
            numB = q.b;
            cherry1Val = 10;
            cherry2Val = numA - 10;
            tenMinusB = 10 - numB;
            finalAns = numA - numB;

            inputValues = { cherry1: '', cherry2: '', tenSub: '', ans: '' };
            activeInputTarget = 'cherry1';

            document.getElementById('num-a').textContent = numA;
            document.getElementById('num-b').textContent = numB;
            
            updateUIState();
            setTimeout(drawSvgConnections, 50);
        }

        // Input Selector
        function selectInput(target) {
            if (currentStep === 1) {
                if (target === 'cherry1' || target === 'cherry2') {
                    activeInputTarget = target;
                    sfx.tap();
                    updateInputStyles();
                }
            } else if (currentStep === 2 && target === 'tenSub') {
                activeInputTarget = 'tenSub';
                sfx.tap();
                updateInputStyles();
            } else if (currentStep === 3 && target === 'ans') {
                activeInputTarget = 'ans';
                sfx.tap();
                updateInputStyles();
            }
        }

        // Update UI State & Guidance
        function updateUIState() {
            const banner = document.getElementById('step-banner');
            const helper = document.getElementById('bottom-helper');
            const tenBadge = document.getElementById('ten-badge');
            const tenSubText = document.getElementById('ten-sub-text');
            const tenSubBtn = document.getElementById('ten-sub-btn');

            document.getElementById('score-text').textContent = `${currentQuestionIndex + 1} / ${totalQuestions} もん`;

            if (currentStep === 1) {
                banner.innerHTML = `【ステップ１】 <span class="text-blue-600 font-extrabold">${numA}</span> を １０ と いくつに わけよう！`;
                
                if (currentLevel === 'egg') {
                    helper.innerHTML = `<span class="text-blue-600 font-bold">${numA}</span> は <span class="text-blue-600 font-bold font-mono text-lg">10</span> と <span class="text-blue-600 font-bold font-mono text-lg">${cherry2Val}</span> に わかれるよ！`;
                } else if (currentLevel === 'chick') {
                    helper.innerHTML = `<span class="text-blue-600 font-bold">${numA}</span> は 10 と いくつに わかれるかな？`;
                } else if (currentLevel === 'chicken') {
                    helper.innerHTML = ``;
                }
                
                tenBadge.classList.add('opacity-0');
            } 
            else if (currentStep === 2) {
                banner.innerHTML = `【ステップ２】 <span class="text-rose-600 font-black">１０ － ${numB}</span> の こたえを いれよう！`;
                tenSubText.textContent = `10 - ${numB} =`;
                
                if (currentLevel === 'egg') {
                    helper.innerHTML = `10 から ${numB} を ひくと <span class="text-rose-600 font-bold font-mono text-lg">${tenMinusB}</span> だね！`;
                } else if (currentLevel === 'chick') {
                    helper.innerHTML = `10 から ${numB} を ひくと いくつかな？`;
                } else {
                    helper.innerHTML = ``;
                }
                tenBadge.classList.remove('opacity-0');
            } 
            else if (currentStep === 3) {
                banner.innerHTML = `【ステップ３】 のこった <span class="text-rose-600 font-black">${tenMinusB}</span> と <span class="text-blue-600 font-black">${cherry2Val}</span> を たそう！`;
                tenSubText.textContent = `10 - ${numB} =`;
                
                if (currentLevel === 'egg' || currentLevel === 'chick') {
                    helper.innerHTML = `${tenMinusB} と ${cherry2Val} で ・・・？`;
                } else {
                    helper.innerHTML = ``;
                }
                tenBadge.classList.remove('opacity-0');
            }

            document.getElementById('cherry-1-btn').textContent = inputValues.cherry1 || '?';
            document.getElementById('cherry-2-btn').textContent = inputValues.cherry2 || '?';
            tenSubBtn.textContent = inputValues.tenSub || '?';
            document.getElementById('ans-box').textContent = inputValues.ans || '?';

            updateInputStyles();
            drawSvgConnections();
        }

        // Highlight active input
        function updateInputStyles() {
            const btn1 = document.getElementById('cherry-1-btn');
            const btn2 = document.getElementById('cherry-2-btn');
            const tenSubBtn = document.getElementById('ten-sub-btn');
            const ansBox = document.getElementById('ans-box');

            btn1.classList.remove('active-input-ring');
            btn2.classList.remove('active-input-ring');
            tenSubBtn.classList.remove('active-input-ring');
            ansBox.classList.remove('active-input-ring');

            if (currentStep === 1) {
                if (activeInputTarget === 'cherry1') {
                    btn1.classList.add('active-input-ring');
                } else if (activeInputTarget === 'cherry2') {
                    btn2.classList.add('active-input-ring');
                }
            } else if (currentStep === 2) {
                tenSubBtn.classList.add('active-input-ring');
            } else if (currentStep === 3) {
                ansBox.classList.add('active-input-ring');
            }
        }

        // Keypad Actions
        function pressKey(num) {
            sfx.tap();
            if (currentStep === 1) {
                if (activeInputTarget === 'cherry1') {
                    if (inputValues.cherry1.length < 2) {
                        inputValues.cherry1 += num.toString();
                    }
                    if (inputValues.cherry1 === '10') {
                        activeInputTarget = 'cherry2';
                    }
                } else if (activeInputTarget === 'cherry2') {
                    inputValues.cherry2 = num.toString();
                }
            } else if (currentStep === 2) {
                inputValues.tenSub = num.toString();
            } else if (currentStep === 3) {
                if (inputValues.ans.length < 2) {
                    inputValues.ans += num.toString();
                }
            }
            updateUIState();
        }

        function pressDelete() {
            sfx.tap();
            if (currentStep === 1) {
                inputValues[activeInputTarget] = '';
            } else if (currentStep === 2) {
                inputValues.tenSub = '';
            } else if (currentStep === 3) {
                inputValues.ans = '';
            }
            updateUIState();
        }

        // Check Answer Logic
        function checkAnswer() {
            if (currentStep === 1) {
                const val1 = parseInt(inputValues.cherry1, 10);
                const val2 = parseInt(inputValues.cherry2, 10);

                if (isNaN(val1) || isNaN(val2)) {
                    showMessage('さくらんぼに かずを いれてね！');
                    sfx.wrong();
                    return;
                }

                if (val1 === cherry1Val && val2 === cherry2Val) {
                    sfx.stepComplete();
                    currentStep = 2;
                    activeInputTarget = 'tenSub';
                    updateUIState();
                } else {
                    sfx.wrong();
                    showMessage(`${numA} は 10 と いくつに わかれるかな？`);
                }
            } else if (currentStep === 2) {
                const step2Val = parseInt(inputValues.tenSub, 10);
                if (isNaN(step2Val)) {
                    showMessage('10 から ひいた こたえを いれてね！');
                    sfx.wrong();
                    return;
                }

                if (step2Val === tenMinusB) {
                    sfx.stepComplete();
                    currentStep = 3;
                    activeInputTarget = 'ans';
                    updateUIState();
                } else {
                    sfx.wrong();
                    showMessage(`10 から ${numB} を ひくと いくつかな？`);
                }
            } else if (currentStep === 3) {
                const finalVal = parseInt(inputValues.ans, 10);
                const expected = finalAns;

                if (isNaN(finalVal)) {
                    showMessage('こたえを いれてね！');
                    sfx.wrong();
                    return;
                }

                if (finalVal === expected) {
                    sfx.correct();
                    triggerConfetti();
                    
                    setTimeout(() => {
                        currentQuestionIndex++;
                        if (currentQuestionIndex < totalQuestions) {
                            loadQuestion(currentQuestionIndex);
                        } else {
                            showFinalResults();
                        }
                    }, 1200);
                } else {
                    sfx.wrong();
                    showMessage('もういちど かんがえてみよう！');
                }
            }
        }

        function showMessage(msg) {
            const banner = document.getElementById('step-banner');
            banner.innerHTML = `<span class="text-rose-600 font-extrabold">${msg}</span>`;
            banner.classList.add('bg-amber-100', 'border-amber-400');
            setTimeout(() => {
                banner.classList.remove('bg-amber-100', 'border-amber-400');
                updateUIState();
            }, 1800);
        }

        function triggerConfetti() {
            try {
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.7 }
                });
            } catch(e){}
        }

        // Draw SVG Connection Lines & Red Oval for 10 - B
        function drawSvgConnections() {
            const svg = document.getElementById('svg-overlay');
            svg.innerHTML = ''; 

            const aNode = document.getElementById('num-a');
            const bNode = document.getElementById('num-b');
            const c1Node = document.getElementById('cherry-1-btn');
            const c2Node = document.getElementById('cherry-2-btn');

            if (!aNode || !bNode || !c1Node || !c2Node) return;

            const svgRect = svg.getBoundingClientRect();

            function getCenter(el) {
                const r = el.getBoundingClientRect();
                return {
                    x: r.left + r.width / 2 - svgRect.left,
                    y: r.top + r.height / 2 - svgRect.top
                };
            }

            const ptA = getCenter(aNode);
            const ptB = getCenter(bNode);
            const ptC1 = getCenter(c1Node);
            const ptC2 = getCenter(c2Node);

            // 1. Cherry Lines from A down to C1 (10) and C2 (Remainder)
            const line1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line1.setAttribute('x1', ptA.x - 8);
            line1.setAttribute('y1', ptA.y + 24);
            line1.setAttribute('x2', ptC1.x);
            line1.setAttribute('y2', ptC1.y - 20);
            line1.setAttribute('class', 'cherry-line');
            svg.appendChild(line1);

            const line2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line2.setAttribute('x1', ptA.x + 8);
            line2.setAttribute('y1', ptA.y + 24);
            line2.setAttribute('x2', ptC2.x);
            line2.setAttribute('y2', ptC2.y - 20);
            line2.setAttribute('class', 'cherry-line');
            svg.appendChild(line2);

            // 2. Step 2 & 3: Enclose C1 (10) and B in an animated red oval to show (10 - B)
            if (currentStep >= 2) {
                const cx = (ptC1.x + ptB.x) / 2;
                const cy = (ptC1.y + ptB.y) / 2;
                const dist = Math.hypot(ptB.x - ptC1.x, ptB.y - ptC1.y);
                
                const rx = (dist / 2) + 38;
                const ry = 46;
                const angleDeg = Math.atan2(ptB.y - ptC1.y, ptB.x - ptC1.x) * (180 / Math.PI);

                const ellipse = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
                ellipse.setAttribute('cx', cx);
                ellipse.setAttribute('cy', cy);
                ellipse.setAttribute('rx', rx);
                ellipse.setAttribute('ry', ry);
                ellipse.setAttribute('transform', `rotate(${angleDeg}, ${cx}, ${cy})`);
                ellipse.setAttribute('class', 'subtract-10-circle');
                svg.appendChild(ellipse);
            }
        }

        function showFinalResults() {
            stampCount++;
            localStorage.setItem('sakuranbo_sub_stamp_count', stampCount.toString());
            updateStampUI();

            sfx.fanfare();
            sfx.stamp();
            
            const modal = document.getElementById('result-modal');
            modal.classList.remove('hidden');
        }

        function confirmResultModal() {
            document.getElementById('result-modal').classList.add('hidden');
            
            if (stampCount >= 10) {
                setTimeout(showSpecialCelebration, 300);
            } else {
                restartGame();
            }
        }

        function showSpecialCelebration() {
            sfx.superFanfare();
            triggerSuperConfetti();
            document.getElementById('special-modal').classList.remove('hidden');
        }

        function resetStampsAndContinue() {
            sfx.tap();
            stampCount = 0;
            localStorage.setItem('sakuranbo_sub_stamp_count', '0');
            updateStampUI();
            document.getElementById('special-modal').classList.add('hidden');
            restartGame();
        }

        function triggerSuperConfetti() {
            try {
                const duration = 3 * 1000;
                const end = Date.now() + duration;

                (function frame() {
                    confetti({
                        particleCount: 7,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0 }
                    });
                    confetti({
                        particleCount: 7,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1 }
                    });

                    if (Date.now() < end) {
                        requestAnimationFrame(frame);
                    }
                }());
            } catch(e){}
        }

        function restartGame() {
            currentQuestionIndex = 0;
            questions = generateQuestions();
            loadQuestion(0);
        }

        window.addEventListener('resize', drawSvgConnections);
        window.onload = function() {
            updateStampUI();
            questions = generateQuestions();
            loadQuestion(0);
        };
    </script>
</body>
</html>
